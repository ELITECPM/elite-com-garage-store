<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elite CPM Garage | Premium Car Store</title>

  <meta name="theme-color" content="#05050a">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <img
      src="elite-logo.png"
      alt="Elite CPM Garage Logo"
      class="logo"
    >

    <div class="brand">
      <h1>ELITE CPM GARAGE</h1>
      <p>PREMIUM CPM CAR STORE</p>
    </div>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#cars">Showroom</a>
    <a href="#contact">Contact</a>
  </nav>

  <section class="hero" id="home">
    <h2>WELCOME TO ELITE CPM GARAGE</h2>

    <p>Discover Your Dream CPM Cars</p>

    <a href="#cars" class="btn">EXPLORE SHOWROOM</a>
  </section>

<section id="showroom">
  <h2>ELITE CPM GARAGE SHOWROOM</h2>

  <div class="category-buttons">
    <button onclick="filterCars('Trending Cars')">🔥 Trending</button>
    <button onclick="filterCars('New Update Cars')">🆕 New Updates</button>
    <button onclick="filterCars('CPM2 Cars')">🚘 CPM2</button>
    <button onclick="filterCars('All')">All Cars</button>
  </div>
<div class="search-box">
  <input
    type="text"
    id="carSearch"
    placeholder="🔍 Search your favourite car..."
    oninput="searchCars()"
  >
</div>
 <div class="cart-section">
  <button onclick="showCart()">
    🛒 MY CART (<span id="cartCount">0</span>)
  </button>
</div>

<div id="cartBox" style="display:none;">
  <h2>MY SHOPPING CART</h2>
  <div id="cartItems"></div>
  <h3>Total: PKR <span id="cartTotal">0</span></h3>
  <button onclick="checkoutCart()">ORDER ON WHATSAPP</button>
</div>
  <div id="carList"></div>
</section>
  <footer id="contact">
    <h3>ELITE CPM GARAGE</h3>
    <p>Premium CPM Cars • Quality • Style</p>
    <p>© 2026 Elite CPM Garage. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=11"></script>

</body>
</html>
