<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elite CPM Garage Store</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

  <h1>ELITE CPM GARAGE</h1>

  <p>PREMIUM CPM CAR STORE</p>

</header>

<section class="hero">

  <h2>WELCOME TO ELITE CPM GARAGE</h2>

  <p>Find Your Dream CPM Car</p>

</section>

<section id="cars">

  <h2>AVAILABLE CARS</h2>

  <input id="search" placeholder="Search your car..." oninput="searchCars()">

  <div id="car-list" class="car-list"></div>

</section>

<section id="admin">

  <h2>STORE ADMIN PANEL</h2>

  <p>Add cars and manage your store below.</p>

  <input id="carName" placeholder="Car name">

  <input id="carPrice" type="number" placeholder="Price in PKR">

  <input id="carDescription" placeholder="Car description">

  <input id="carImage" type="url" placeholder="Car image URL">

  <button class="btn" onclick="addCar()">ADD NEW CAR</button>

</section>

<footer>

  <p>© 2026 ELITE CPM GARAGE</p>

</footer>

<script src="app.js"></script>

</body>

</html>
